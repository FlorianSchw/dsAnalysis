#### GitHub Action to increment the public-facing version based on semantic versioning v2

name: Release
on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          repository: FlorianSchw/dsAnalysis
          event-type: semantic-release
