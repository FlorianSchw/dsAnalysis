name: R-CMD-check

on:
  pull_request:
    branches: [dev]
    paths: ['R/**', 'tests/**', 'inst/**', '.github/**', 'DESCRIPTION', 'NAMESPACE']
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    uses: FlorianSchw/package-workflows/.github/workflows/r-cmd-check.yml@main
    with:
      r-version-list: '["release", "4.4.3"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: FlorianSchw/package-workflows/.github/workflows/workflow-keepalive.yml@main
