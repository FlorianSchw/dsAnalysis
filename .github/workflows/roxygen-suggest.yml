name: Roxygen Doc Suggestions

on:
  pull_request:
    branches: [main]
    paths: ['R/**']
  schedule:
    - cron: '0 6 1 * *'   # monthly sweep of the whole package
  workflow_dispatch:

jobs:
  suggest-docs:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: FlorianSchw/package-workflows/.github/workflows/roxygen-suggest.yml@main
    # PR: only what is new since the last run. Schedule and manual run: sweep of main.
    with:
      datashield: true
      datashield-type: utility
      sweep-base: main
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_ROXYGEN }}
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: FlorianSchw/package-workflows/.github/workflows/workflow-keepalive.yml@main
